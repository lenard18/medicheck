  <body>
    <div id="app"></div>

    <!-- ══════════════════════════════════════════════════════════
         REGISTRO DEL SERVICE WORKER
         - En producción: lo registra normalmente
         - En localhost (desarrollo): lo desregistra para evitar
           que la caché rompa el hot-reload de Vite
    ═══════════════════════════════════════════════════════════ -->
    <!-- SPA redirect restore (GitHub Pages 404 trick) -->
    <script>
      (function() {
        var p = window.location.search.slice(1).split('&p=')[1];
        if (p) {
          var decoded = decodeURIComponent(p.replace(/~and~/g, '&'));
          window.history.replaceState(null, null, '/' + decoded);
        }
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          // DESARROLLO: desregistrar SW para no interferir con Vite
          navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(reg => {
              reg.unregister();
              console.log('[MediCheck] SW desregistrado en dev ✓');
            });
          });
        } else {
          // PRODUCCIÓN: registrar SW
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/medicheck/sw.js', { scope: '/medicheck/' })
              .then(reg => {
                console.log('[MediCheck] SW registrado:', reg.scope);

                // Verificar actualizaciones cada 1 hora
                setInterval(() => reg.update(), 60 * 60 * 1000);
              })
              .catch(err => console.warn('[MediCheck] SW error:', err));
          });
        }
      }
    </script>
  </body>
